version: '3.8'

# 所有密钥都从 docker/.env 读（见 .env.example）。
#
# 用 ${VAR:?} 而不是 ${VAR:-默认值} 是刻意的：没配就直接拒绝启动。
# 这个文件原先只注入了数据源和 Redis 的变量，**没有**注入 APP_SECRET_KEY，
# 于是照仓库文档部署出来的系统用的就是写死在 application.yml 里的那个密钥 ——
# 而它随仓库公开，等于把设备令牌的签发权一起公开了。文档里写「生产请覆盖」挡不住这件事，
# 所以改成不说清楚就起不来。

services:
  mysql:
    image: mysql:8.0
    container_name: sms-gateway-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 docker/.env 中设置}
      MYSQL_DATABASE: sms_gateway
      MYSQL_USER: smsuser
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在 docker/.env 中设置}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      # 只绑回环：以前是 "3306:3306"，等于把数据库端口发布到所有网卡上。
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ../backend/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:?}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sms-gateway-redis
    # 必须设密码：Redis 里明文存着管理员令牌（sms:admin:token:*）和调用方 API Key
    # （key 名本身就是密钥），无密码 + 端口外放等于把管理后台拱手让人。
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?请在 docker/.env 中设置}"]
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: sms-gateway-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/sms_gateway?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8mb4
      SPRING_DATASOURCE_USERNAME: smsuser
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:?请在 docker/.env 中设置}
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SPRING_REDIS_PASSWORD: ${REDIS_PASSWORD:?请在 docker/.env 中设置}

      # 系统主密钥：设备令牌 = HMAC-SHA256(deviceId, 它)。
      # 换了它，所有已签发的设备令牌立即失效，每台设备都要重新注册。
      APP_SECRET_KEY: ${APP_SECRET_KEY:?请在 docker/.env 中设置}

      # 仅在 admin_user 表为空时用于创建账号。已建过账号的系统，改它不会有任何效果 ——
      # 那种情况用下面的 APP_ADMIN_RESET_PASSWORD。
      APP_ADMIN_DEFAULT_PASSWORD: ${APP_ADMIN_DEFAULT_PASSWORD:?请在 docker/.env 中设置}

      # 需要轮换管理员密码时临时设上、重启、确认登录成功后删掉。
      APP_ADMIN_RESET_PASSWORD: ${APP_ADMIN_RESET_PASSWORD:-}

      TZ: ${TZ:-Asia/Shanghai}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  mysql_data:
