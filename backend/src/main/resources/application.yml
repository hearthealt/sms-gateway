server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/sms_gateway?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8
    username: ${SPRING_DATASOURCE_USERNAME:root}
    # 冒号后面的是本机开发的默认值。生产必须通过环境变量覆盖 ——
    # docker-compose 那边用的是 ${VAR:?} 语法，没给就拒绝启动，不给"悄悄用默认值"的机会。
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      # 本机开发通常没设密码，留空；生产必须设 —— Redis 里明文存着管理员令牌和 API Key。
      password: ${SPRING_REDIS_PASSWORD:}
      timeout: 3000

app:
  sms:
    # 保留天数与清理执行时间**不在这里** —— 它们已搬到数据库的 sys_config 表，
    # 在管理后台「系统设置」页改，改完立即生效、不用重启。
    #
    # 每批删除的行数留在这里：它是「改了要重启、且几乎不会调」的那种参数。
    # 设小一点是为了让每批都能快速提交、尽快释放锁，同库的短信写入不会被长时间堵住。
    cleanup-batch-size: 1000

  secret:
    # 设备令牌 = HMAC-SHA256(deviceId, 这个 key)。它是确定性的：知道 key 的人
    # 可以对**任意** deviceId 直接算出合法令牌，冒充任何设备上报与读取短信。
    #
    # 所以这个值等于系统的主密钥，绝不能用仓库里的默认值上生产。
    # 默认值刻意写成一眼可辨的 DEV-ONLY，启动时 SecretKeyValidator 会就此告警。
    key: ${APP_SECRET_KEY:DEV-ONLY-smart-gateway-change-me-3f9a}
  # 外部调用方密钥不再走配置：由管理后台「API 密钥」页签发，存 api_key 表。
  # api-key 的校验缓存时长**不在这里** —— 已搬到数据库，在「系统设置」页改。
  admin:
    # 首次启动且 admin_user 表为空时，用这组配置创建管理员账号（BCrypt 哈希后入库）。
    # 生产环境必须通过环境变量覆盖。
    default-username: ${APP_ADMIN_DEFAULT_USERNAME:admin}
    default-password: ${APP_ADMIN_DEFAULT_PASSWORD:DEV-ONLY-change-me}
    # 改密码的唯一途径。
    #
    # 原先只有 default-password，而它仅在 admin_user 表为空时生效 —— 一旦建过账号，
    # 改配置再重启也不会更新密码，日志里那句「请尽快修改默认密码」因此无从执行
    # （管理接口里也没有改密码的功能）。设了下面这个变量，启动时会把该账号的密码
    # 重置成它，用完把变量撤掉即可。留空则完全不做任何事。
    reset-password: ${APP_ADMIN_RESET_PASSWORD:}
    # 登录有效期**不在这里** —— 已搬到数据库，在「系统设置」页改，改完立即生效。
    # 注意：已登录的会话不受影响，新时长只对之后登录的人生效。

  # 消息转发（v2）。渠道配置方法见 docs/notify-channel-setup.md。
  #
  # **这里只放两类东西：密钥，和「改了必须重启」的底层参数。**
  # 运行期能调的（转发总开关、轮询间隔、失败阈值、短信保留天数）都在数据库的
  # sys_config 表里，管理后台「系统设置」页改完**立即生效** —— 见 SysConfigKey。
  # 判断某项该放哪边：运维过程中会不会想调、调完想不想立刻看到效果。
  notify:
    # 渠道凭据（webhook 地址）的加密密钥，Base64 编码的 32 字节。
    # 生成：openssl rand -base64 32
    #
    # **它必须留在环境变量里，不能进库**：用库里的密钥去解库里的密文是循环依赖。
    # 所以「启用转发」那一步会检查它在不在 —— 不在就会拒绝启用并告诉你该设什么。
    #
    # 留空时应用照常启动，只是转发不可启用（可选能力不该成为整个应用的启动依赖）。
    # 但配了却格式不对时会拒绝启动：那是明确的配置错误，不该被静默降级成「功能没反应」。
    #
    # 这个密钥丢了，所有渠道凭据都要重配 —— 密文在库里，没有密钥读不出来。
    encrypt-key: ${NOTIFY_ENCRYPT_KEY:}

    dispatcher:
      # 单轮最多取多少条。取多了会在一轮里吃满线程池，下一轮又是空的。
      batch-size: 100
      # 并发投递的渠道数。**同一渠道内部仍是串行** —— 对端的限额按渠道算，
      # 并发发送会在一瞬间打满限额（钉钉超限罚 10 分钟、Slack 超限可能永久禁用）。
      max-concurrent-channels: 8
      # 退避基数与上限。实际等待是 Full Jitter（随机取 [0, base * 2^attempt)），
      # 不加抖动的话同时失败的一批会在同一时刻一起重试，反而加剧限流。
      retry-base-ms: 5000
      retry-cap-ms: 3600000

    # 进程被杀后，停在 SENDING 超过这么久的记录会被退回待投递
    stuck-sending-seconds: 120

    http:
      connect-timeout-ms: 3000
      read-timeout-ms: 10000
      # 响应体最多读这么多字节。对端是管理员填的任意地址（通用 webhook），
      # 不设上限的话一个超大响应就能把进程内存吃掉；而我们对响应体没有实际用途。
      max-response-bytes: 8192