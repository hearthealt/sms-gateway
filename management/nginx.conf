server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 前端是 SPA（vue-router 走 history 模式），刷新子路由不能让 nginx 去 404。
    # 找不到的路径一律回 index.html，由前端路由接管。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端接口。backend 是同一个 compose 网络里的服务名。
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;

        # 管理后台的实时刷新走 GET /api/admin/events（SSE），下面两条缺一不可：
        #   proxy_buffering off —— 不关的话事件会被 nginx 缓冲住，界面永远不会自动刷新
        #   proxy_read_timeout  —— 默认 60 秒会掐断长连接，前端只能不停重连
        #
        # 两条都漏掉时的表现是「界面什么都不动、但也不报错」，
        # 最容易误判成前端坏了 —— 所以写在这里，随镜像一起走。
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
