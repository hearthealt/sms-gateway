# 这个文件是**模板**：容器启动时由 render-templates.sh 渲染成
# /etc/nginx/conf.d/default.conf（只替换 ${FRONTEND_PORT} 这一个变量，
# 下面那些 $host / $remote_addr 是 nginx 自己的变量，保持原样）。
#
# 所以改监听端口不用改这里 —— 改 docker/.env 里的 FRONTEND_PORT，重建前端容器即可。
server {
    # 对外端口。容器用的是 host 网络（与宿主机共用网络栈），所以这里 listen 什么，
    # 宿主机上就是什么 —— 也因此别再指望 compose 的 ports:，那个在 host 网络下无效。
    listen ${FRONTEND_PORT};
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 前端是 SPA（vue-router 走 history 模式），刷新子路由不能让 nginx 去 404。
    # 找不到的路径一律回 index.html，由前端路由接管。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端接口。后端容器同样在 host 网络上，并且只监听回环（SERVER_ADDRESS=127.0.0.1），
    # 所以这里写 127.0.0.1 —— 外部（含设备）只能经这一层进来，后端端口不对公网开放。
    # ${BACKEND_PORT} 与后端容器里的 SERVER_PORT 是同一个值（都来自 docker/.env）。
    location /api/ {
        proxy_pass http://127.0.0.1:${BACKEND_PORT};
        proxy_http_version 1.1;

        # 管理后台的实时刷新走 GET /api/admin/events（SSE），下面两条缺一不可：
        #   proxy_buffering off —— 不关的话事件会被 nginx 缓冲住，界面永远不会自动刷新
        #   proxy_read_timeout  —— 默认 60 秒会掐断长连接，前端只能不停重连
        #
        # 两条都漏掉时的表现是「界面什么都不动、但也不报错」，
        # 最容易误判成前端坏了 —— 所以写在这里，随镜像一起走。
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
